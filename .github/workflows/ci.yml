name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check app tests migrations
      - run: pytest
      - name: Verify migration SQL generation
        run: alembic upgrade head --sql > /tmp/aimz-migration.sql
      - name: Install Cloudflare API dependencies
        run: npm ci
        working-directory: cloudflare-api
      - name: Typecheck Cloudflare API
        run: npm run typecheck
        working-directory: cloudflare-api
      - name: Validate Cloudflare Worker bundle
        run: npm run deploy:dry-run
        working-directory: cloudflare-api

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check Expo dependency compatibility
        run: pnpm exec expo install --check
      - name: Export staging web app
        run: pnpm web:export
        env:
          EXPO_PUBLIC_API_URL: https://aimz-api-staging.shared-links.workers.dev
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_ENABLE_MEDIA: "false"
          EXPO_PUBLIC_ENABLE_PASSWORD_RESET: "false"
      - name: Upload staging web artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: staging-web-dist
          path: mobile/dist
          if-no-files-found: error
          retention-days: 1

  pages:
    name: Deploy Pages
    needs: [backend, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      url: https://aimz-egypt-staging.pages.dev
    steps:
      - name: Download staging web artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-web-dist
          path: mobile/dist
      - name: Deploy staging web app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy mobile/dist --project-name=aimz-egypt-staging --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
