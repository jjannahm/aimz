name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The API that is actually deployed. Blocking: nothing below it should reach
  # staging on a Worker that does not typecheck, does not pass its tests, or
  # does not bundle. These steps used to live inside the advisory Backend job,
  # where `continue-on-error` covered them too and a broken Worker would still
  # have deployed.
  api:
    name: Cloudflare API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-api/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Validate the Worker bundle
        run: npm run deploy:dry-run
      # Advisory. Cloudflare is the platform and `backend/` is a frozen
      # reference, so the gap is expected — this keeps it visible and
      # accurate instead of letting a hand-typed number in the docs rot.
      - name: Report FastAPI parity
        run: npm run parity

  # The FastAPI reference implementation, which nothing deploys. Cloudflare is
  # the platform; `backend/` is frozen and behind the Worker by twelve endpoint
  # families (`npm run parity` in cloudflare-api prints the current gap).
  # Advisory on purpose — it reports rather than blocks.
  #
  # The steps below are skipped when a pull request does not touch `backend/`,
  # which is most of them. The job itself always runs: "Backend" is a required
  # status check in branch protection, and a job that never starts never
  # reports, which would leave every unrelated pull request waiting forever.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch backend/?
        id: changed
        working-directory: .
        run: |
          # Anything other than a clean "nothing under backend/ changed"
          # answer runs the checks, so a missing ref can never silently skip.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^backend/'; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "No backend/ changes; skipping the FastAPI checks." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.result == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - if: steps.changed.outputs.result == 'true'
        run: pip install -e '.[dev]'
      - if: steps.changed.outputs.result == 'true'
        run: ruff check app tests migrations
      - if: steps.changed.outputs.result == 'true'
        run: pytest
      - name: Verify migration SQL generation
        if: steps.changed.outputs.result == 'true'
        run: alembic upgrade head --sql > /tmp/aimz-migration.sql

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check Expo dependency compatibility
        run: pnpm exec expo install --check
      - name: Export staging web app
        run: pnpm web:export:staging
      - name: Upload staging web artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: staging-web-dist
          path: mobile/dist
          if-no-files-found: error
          retention-days: 1

  worker:
    name: Deploy Worker
    needs: api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: staging
      url: https://aimz-api-staging.shared-links.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Apply D1 migrations and deploy staging API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-api
          wranglerVersion: "4.124.0"
          preCommands: wrangler d1 migrations apply aimz-staging-db --remote
          command: deploy --minify
      - name: Verify match phase endpoint
        run: |
          status="$(curl --silent --show-error --output /tmp/phase-probe.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"start_match"}' \
            https://aimz-api-staging.shared-links.workers.dev/api/v1/matches/deployment-probe/phase)"
          if [ "$status" != "401" ]; then
            cat /tmp/phase-probe.json
            exit 1
          fi

  pages:
    name: Deploy Pages
    needs: [mobile, worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      url: https://aimz-egypt-staging.pages.dev
    steps:
      - name: Download staging web artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-web-dist
          path: mobile/dist
      - name: Deploy staging web app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy mobile/dist --project-name=aimz-egypt-staging --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the live site targets the staging API
        run: |
          set -euo pipefail
          api="https://aimz-api-staging.shared-links.workers.dev"
          site="https://aimz-egypt-staging.pages.dev"
          index="$(mktemp)"
          bundle_file="$(mktemp)"
          # Download before matching. Piping curl into grep -q closes the pipe on
          # the first match, which fails curl with exit 23 under pipefail.
          for attempt in 1 2 3 4 5; do
            if curl --silent --show-error --fail "$site/" --output "$index"; then
              bundle="$(grep -o '/_expo/static/js/web/entry-[a-f0-9]*\.js' "$index" | head -n 1 || true)"
              if [ -n "$bundle" ] && curl --silent --show-error --fail "$site$bundle" --output "$bundle_file"; then
                if grep -q "$api" "$bundle_file"; then
                  echo "Live bundle $bundle targets $api."
                  exit 0
                fi
              fi
            fi
            echo "Attempt $attempt: live site is not serving $api yet; retrying." >&2
            sleep 10
          done
          echo "The deployed site is not targeting $api. It may have been built with a stale cache." >&2
          exit 1
