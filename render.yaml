services:
  - type: web
    name: aimz-api-staging
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && aimz-seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: AIMZ Egypt API (Staging)
      - key: ENVIRONMENT
        value: staging
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: MEDIA_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: INITIAL_INVITE_CODE
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
