services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aimz}
      POSTGRES_USER: ${POSTGRES_USER:-aimz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - aimz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aimz}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-aimz}
      BACKEND_CORS_ORIGINS: '["http://localhost:8081","http://localhost:19006"]'
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      ADMIN_NAME: ${ADMIN_NAME:-AIMZ Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aimz.example}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
      INITIAL_INVITE_CODE: ${INITIAL_INVITE_CODE:-AIMZ-PLAY}
      REVIEW_NAME: ${REVIEW_NAME:-}
      REVIEW_EMAIL: ${REVIEW_EMAIL:-}
      REVIEW_PASSWORD: ${REVIEW_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-scores@aimz.example}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PRESIGN_SECONDS: ${S3_PRESIGN_SECONDS:-900}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-5242880}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aimz_postgres_data:
