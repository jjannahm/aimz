[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aimz-api"
version = "0.1.0"
description = "AIMZ Egypt scores API"
requires-python = ">=3.12"
dependencies = [
  # 5.1.2+: STARTTLS response injection (PYSEC-2026-3805) and CR/LF in addresses.
  "aiosmtplib>=5.1.3,<6",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  # 50+: fixes for the bundled OpenSSL and X.509/PKCS7 advisories.
  "cryptography>=50.0.1,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  # 9.0.3+: predictable /tmp/pytest-of-{user} directories (PYSEC-2026-1845).
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
aimz-seed = "app.cli:main"
aimz-seal-health-data = "app.cli:seal_main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
