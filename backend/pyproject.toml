[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aimz-api"
version = "0.1.0"
description = "AIMZ Egypt scores API"
requires-python = ">=3.12"
dependencies = [
  "aiosmtplib>=4,<5",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
aimz-seed = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
