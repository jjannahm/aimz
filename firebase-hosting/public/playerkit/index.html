							<div class="tab-pane" id="about">

									<h5 class="info-text">Player Kit</h5>

									<div class="col-sm-6">
										<div class="form-group">
											<label>Full Name <small>(required)</small></label>
											<input name="firstname" required type="text" id="fullname"
												class="form-control" placeholder="Enter Full Name...">
										</div>
										<div class="form-group">
											<label>Player or Goalkeeper</label><br>
											<select name="type" id="Goalkeeper" class="form-control" required>
												<option value="Player"> Player </option>
												<option value="Goalkeeper"> Goalkeeper </option>

											</select>
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label>Date of Birth <small>(required)</small></label>
											<input class="form-control" id="dateOfBirth" name="dateOfBirth" required type="text" size="20">

										</div>
										<div class="form-group">
											<label for="teams">Team</label><br>
											<select name="team" id="teams" class="form-control" required></select>
										</div>
									</div>

								</div>

							<div class="tab-pane" id="address">
								<div class="row">

									<div class="col-sm-12"> </div>
									<script>
										function changeNum() {
											var x = document.getElementById("Num").value;

											if (isNaN(x)) {
												x = '';
											}
											else {
												document.getElementById("displayNum").innerHTML = x;
												document.getElementById("displayNum2").innerHTML = x;
											}
										}

										function changeName() {
											var x = document.getElementById("Name").value;
											document.getElementById("displayName").innerHTML = x;
										}
									</script>


									<div class="col-sm-6" style="margin-top: 3rem;">
										<div class="form-group">
											<label>Name on Kit <small>( Enter only 9 characters )</small></label>
											<div>
												<input
													required
													maxlength="9" id="Name" name="kn1" onkeypress="changeName()"
													onchange="changeName()" onkeyup="changeName();"
													onpaste="changeName();" oninput="changeName();" type="text"
													class="form-control" style="margin-right: 0.5rem;">
											</div>
										</div>

										<div class="form-group">
											<label>Kit Number <small>( Enter only 2 numbers )</small></label>
											<input
												required
												name="knum1" id="Num" type="tel" onkeypress="changeNum()"
												onchange="changeNum()" onkeyup="changeNum();" onpaste="changeNum();"
												oninput="changeNum();" class="form-control" maxlength="2" />
										</div>

										<div class="form-group">
											<label>Kit Size</label><br>
											<select name="ksize" id="kitsize" class="form-control" required>
												<option value="4"> 4 </option>
												<option value="6"> 6 </option>
												<option value="8"> 8 </option>
												<option value="10"> 10 </option>
												<option value="12"> 12 </option>
												<option value="14"> 14</option>
												<option value="16"> 16</option>
												<option value="S"> S </option>
												<option value="M"> M </option>
												<option value="L"> L</option>
												<option value="XL"> XL </option>
											</select>
										</div>

										<div class="form-group">
											<label>Aimz out wear t-shirt size</label><br>
											<select name="outwearsize" id="outwearsize" class="form-control" required>
												<option value="4"> 4 </option>
												<option value="6"> 6 </option>
												<option value="8"> 8 </option>
												<option value="10"> 10 </option>
												<option value="12"> 12 </option>
												<option value="14"> 14</option>
												<option value="16"> 16</option>
												<option value="S"> S </option>
												<option value="M"> M </option>
												<option value="L"> L</option>
												<option value="XL"> XL </option>
											</select>
										</div>

										<div class="form-group">
											<label>Hoodie Size</label><br>
											<select name="hsize" id="hoodiesize" class="form-control" required>
												<option value="4"> 4 </option>
												<option value="6"> 6 </option>
												<option value="8"> 8 </option>
												<option value="10"> 10 </option>
												<option value="12"> 12 </option>
												<option value="14"> 14</option>
												<option value="16"> 16</option>
												<option value="S"> S </option>
												<option value="M"> M </option>
												<option value="L"> L</option>
												<option value="XL"> XL </option>
											</select>
										</div>

										<div class="form-group">
											<label>Kit to be received by:</label><br>
											<select name="receive_kit_by" name="receive_kit_by" id="receive_kit_by" class="form-control" required>
												<option value="Branch (at training site)">Branch (at training site)</option>
												<option value="Home Delivery">Home Delivery</option>
											</select>
										</div>

									<input type='button' onclick="submitForm()"
