<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join AIMZ</title><link rel="stylesheet" href="/shared.css"></head><body><main><header><div class="mark">AIMZ</div><div><h1>Your AIMZ invitation</h1><p id="context">Checking your invitation…</p></div></header><section><p id="error" class="error" role="alert"></p><a id="open" class="button" href="#">Open the AIMZ app</a><a id="web" class="button secondary" href="#">Continue on the web</a></section></main><script>const code=location.pathname.split('/').filter(Boolean).pop().toUpperCase().replace(/[^A-Z0-9]/g,'');const web=`https://aimz-egypt-staging.pages.dev/register?code=${encodeURIComponent(code)}`;document.querySelector('#open').href=`aimz://join/${code}`;document.querySelector('#web').href=web;fetch('https://aimz-api-staging.shared-links.workers.dev/api/v1/auth/invitations/resolve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})}).then(async response=>{if(!response.ok)throw new Error((await response.json()).detail?.message||'Invitation unavailable.');return response.json()}).then(invite=>document.querySelector('#context').textContent=[invite.label,invite.kind,invite.team_name].filter(Boolean).join(' · ')).catch(error=>{document.querySelector('#context').textContent='Invitation unavailable';document.querySelector('#error').textContent=error.message});</script></body></html>
